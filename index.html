<style>
/* Opción O · "La historia de tu casa", illustrated.
   N's eight-scene story, now with one painted world: eight Higgsfield illustrations of the same family.
   Each scene opens through an arch (the window/door shape), the camera drifts and follows the pointer,
   and light carries the story: the sun, the path that lights up, the phone, the open door, the window at night.
   Copy: marketing/STORY-v2.md. All people are illustrated characters, not customers. */
:root{
  color-scheme:dark;
  --senal:#14CE00; --monte:#0D3B26; --noche:#02251a; --hoja:#0B7A1A; --brote:#E3F5D9;
  --tinta:#141316; --papel:#FBF7F0; --arena:#F2EADC; --maiz:#F4B63F;
  --sans:"Plus Jakarta Sans",system-ui,sans-serif; --serif:"Newsreader",Georgia,serif;
  --ease:cubic-bezier(.75,0,.2,1); --soft:cubic-bezier(.2,.7,.2,1);
  --W:max(100vw,176.8vh); --H:max(56.56vw,100vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--noche);color:#fff;font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--senal);outline-offset:3px;border-radius:6px}
/* green ring is too faint on light/orange backgrounds: follow the header colour there, use ink on paper */
.top :focus-visible,.nav :focus-visible{outline-color:var(--chrome,#fff)}
.ink :focus-visible,#page :focus-visible,#flow :focus-visible{outline-color:var(--tinta)}
.lg{display:block;height:24px;width:auto;aspect-ratio:1155.56/245.679;color:#fff;transition:color .6s}
.needs{background:#FFE36B;color:#3a2a00;font-family:var(--sans);font-style:normal;font-weight:700;font-size:12px;line-height:1.5;padding:1px 6px;border-radius:5px;display:inline-block;max-width:100%;vertical-align:middle}

/* chrome */
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px clamp(18px,3vw,36px);transition:color .6s}
.dots{display:flex;gap:18px}
.dots button{position:relative;width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.45;transition:all .4s var(--soft)}
.dots button.on{opacity:1;background:transparent;box-shadow:0 0 0 2px currentColor;transform:scale(1.45)}
.dots button span{position:absolute;top:20px;left:50%;translate:-50% 0;white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .3s}
.dots button.on span,.dots button:hover span{opacity:1}
.dots button:focus-visible{opacity:1}
.tr{display:flex;gap:8px;justify-content:flex-end}
/* header pills carry their own dark backing so they read on light scenes (02 orange, 04 yellow) too */
.pill{min-height:42px;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:0 16px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(20,19,22,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s,color .25s}
.pill:hover{background:#fff;color:var(--tinta)}
.pill.go{background:var(--senal);border-color:var(--senal);color:var(--tinta)}
@media(max-width:760px){.dots{display:none}.top{grid-template-columns:1fr auto}.tr .faqb{display:none}.pill{padding:0 12px}}
.prog{position:fixed;left:0;bottom:0;height:4px;background:var(--senal);z-index:31;transition:width 1s var(--ease)}

/* intro */
#intro{position:fixed;inset:0;z-index:60;background:#0b1a3d url(assets/img/il-1.jpg) center/cover;display:grid;place-items:center;padding:24px;transition:opacity 1.2s var(--ease),visibility 0s 1.2s}
#intro::before{content:"";position:absolute;inset:0;background:rgba(6,14,40,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#intro.gone{opacity:0;visibility:hidden}
#intro p{position:relative;font-family:var(--serif);font-size:clamp(24px,2.6vw,38px);line-height:1.3;max-width:26ch;text-align:center;min-height:3em}
#intro p::after{content:"";display:inline-block;width:2px;height:1em;background:var(--senal);margin-left:4px;vertical-align:-.15em;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
#skip{position:fixed;right:clamp(18px,3vw,36px);top:24px;z-index:61;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.8}

/* scenes: open through an arch */
.scene{position:fixed;inset:0;visibility:hidden;display:grid;place-items:center;overflow:hidden;z-index:1;
  clip-path:inset(100% 0 0 0 round 50vw 50vw 0 0);transition:clip-path 1.15s var(--ease),visibility 0s 1.2s}
.scene.back{clip-path:inset(0 0 100% 0 round 0 0 50vw 50vw)}
.scene.on{visibility:visible;z-index:2;clip-path:inset(0 0 0 0 round 0 0 0 0);transition:clip-path 1.15s var(--ease)}
.scene.under{visibility:visible;z-index:1;clip-path:inset(0)}
.mv{position:absolute;inset:0;transition:transform 1.15s var(--ease),filter 1.15s}
.scene:not(.on) .mv{transform:scale(1.14)}
.scene.on .mv{transform:none}
.scene.under .mv{transform:translateY(-7%) scale(1.04);filter:brightness(.7)}
.scene.under.rev .mv{transform:translateY(7%) scale(1.04)}
.cam{position:absolute;inset:-3%;transition:transform 1.4s var(--soft)}
.fr{position:absolute;width:var(--W);height:var(--H);left:calc((106vw - var(--W)) * var(--fx,.5));top:calc((106vh - var(--H)) * var(--fy,.5))}
.fr>img{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:var(--ox,50%) var(--oy,50%)}
.fr>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:var(--ox,50%) var(--oy,50%);opacity:0;transition:opacity .8s}
.fr>video.ok{opacity:1}
.scene.on .fr>img,.scene.on .fr>video{animation:kb 22s var(--soft) both}
.has-v .gl,.has-v .final-gl{display:none}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}

/* cut-paper layer */
.spl{position:absolute;inset:0;z-index:2;pointer-events:none}
.sp{position:absolute;display:block;transform:translate(calc(var(--px,0) * var(--d) * -1px),calc(var(--py,0) * var(--d) * -1px));transition:transform 1.3s var(--soft)}
.sp>b{display:block;transform:scaleX(var(--fl))}
.sp img{display:block;width:100%;height:auto;filter:drop-shadow(0 22px 26px rgba(0,0,0,.28));opacity:0;
  transform:translate(var(--fx),var(--fy)) rotate(var(--r0)) scale(.85);transition:opacity .9s var(--soft),transform 1.6s var(--soft);transition-delay:var(--dl)}
.scene.on .sp img{opacity:1;transform:rotate(var(--r))}
.scene.under .sp img{opacity:0;transition-delay:0s;transition-duration:.6s}
.sp.night img{filter:brightness(.42) saturate(.8) drop-shadow(0 22px 26px rgba(0,0,0,.4))}
.scene.on .sp.sway>b{animation:sway 7s ease-in-out infinite;transform-origin:50% 100%}
.scene.on .sp.hover>b{animation:hover 2.6s ease-in-out infinite}
.scene.on .sp.drift>b{animation:drift 9s ease-in-out infinite}
.scene.on .sp.swing>b{animation:swing 4.5s ease-in-out infinite;transform-origin:50% 4%}
.scene.on .sp.spin>b{animation:spin 60s linear infinite}
@keyframes sway{0%,100%{transform:scaleX(var(--fl)) rotate(0)}50%{transform:scaleX(var(--fl)) rotate(2.2deg)}}
@keyframes hover{0%,100%{transform:scaleX(var(--fl)) translateY(0)}50%{transform:scaleX(var(--fl)) translateY(-14px) rotate(-3deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(10px,-16px) rotate(3deg)}66%{transform:translate(-8px,-6px) rotate(-2deg)}}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* light */
.gl{position:absolute;translate:-50% -50%;aspect-ratio:1;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,140,.85) 0%,rgba(255,196,80,.35) 35%,rgba(255,180,60,0) 70%);opacity:0}
.scene.on .gl{animation:breathe 4.5s ease-in-out 1.2s infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
.gl.g{background:radial-gradient(circle,rgba(170,255,140,.9) 0%,rgba(20,206,0,.45) 35%,rgba(20,206,0,0) 70%)}
.scene.on .path .gl{animation:stone 3.6s ease-in-out infinite;animation-delay:calc(1s + var(--k) * .22s)}
@keyframes stone{0%,100%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.1)}45%{opacity:.15;transform:scale(.9)}}
.tw{position:absolute;width:.5%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 70%);mix-blend-mode:screen}
.scene.on .tw{animation:tw 3s ease-in-out infinite;animation-delay:calc(var(--k) * .45s)}
@keyframes tw{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(3.2);opacity:1}}
.lit{position:absolute;inset:0;background:#000;opacity:.55;transition:opacity 2.2s var(--ease) 1.4s;pointer-events:none}
.scene.on .lit{opacity:0}
.win-gl{position:absolute;translate:-50% -50%;aspect-ratio:1;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;transform:scale(.4);
  background:radial-gradient(circle,rgba(255,226,140,.95) 0%,rgba(255,190,70,.35) 38%,rgba(255,180,60,0) 70%);transition:opacity 1.2s,transform 1.2s var(--soft)}
.win-gl.on{opacity:1;transform:scale(1)}
.final-gl{transition:opacity 2s 2.4s}
.scene.on .final-gl{opacity:1;animation:breathe 5s ease-in-out 4s infinite}

/* text */
.txt{position:relative;z-index:3;padding:0 20px;display:grid;gap:18px;pointer-events:none;align-self:center;justify-self:center;text-align:center;justify-items:center}
.txt>*{pointer-events:auto}
.txt.left{justify-self:start;text-align:left;justify-items:start;padding-left:clamp(20px,7vw,130px);max-width:min(46vw,720px)}
.txt.left .sub{max-width:34ch}
.txt.cover{justify-self:start;text-align:left;justify-items:start;padding-left:47vw;align-self:start;padding-top:15vh}
.txt.high{align-self:start;padding-top:13vh}
.n{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.n b{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;border:1.5px solid currentColor;font-size:11px;letter-spacing:.08em}
.h{font-family:var(--serif);font-weight:500;font-size:clamp(46px,6.6vw,112px);line-height:.96;letter-spacing:-.025em;max-width:11ch;text-wrap:balance}
.h em{font-style:italic;font-weight:400}
.h.md{font-size:clamp(40px,5.2vw,88px);max-width:14ch}
.sub{font-size:clamp(16px,1.2vw,19px);max-width:38ch;line-height:1.55;font-weight:500}
.read{margin-top:4px;background:#fff;color:var(--tinta);border-radius:999px;min-height:50px;padding:0 24px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;transition:background .25s,transform .25s,color .25s}
.read:hover{background:var(--senal);color:var(--tinta);transform:translateY(-2px)}
.read.dark{background:var(--tinta);color:#fff}.read.dark:hover{background:var(--senal);color:var(--tinta)}
.read.go{background:var(--senal);color:var(--tinta)}
.ink{color:var(--tinta)}
.flink{font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:5px;min-height:44px}
/* word-by-word rise */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .14em .08em;margin:0 -.14em -.08em}
.w>span{display:inline-block;transform:translateY(105%);transition:transform 1s var(--soft);transition-delay:calc(.75s + var(--i) * .07s)}
.scene.on .w>span{transform:none}
.txt>:not(.h){opacity:0;transform:translateY(14px);transition:opacity .8s var(--soft),transform .8s var(--soft);transition-delay:1.25s}
.txt>.n{transition-delay:.6s}
.scene.on .txt>:not(.h){opacity:1;transform:none}
.txt>.read,.txt>.sub+.sub{transition-delay:1.45s}

/* windows building (Para ti) */
.bld{position:relative;z-index:3;display:grid;gap:14px;justify-items:center;width:min(640px,100% - 32px);padding-top:30px;text-align:center}
.facade{position:relative;width:100%;margin-top:clamp(64px,7vw,92px);background:#5c1730;border-radius:6px 6px 0 0;padding:clamp(18px,3vw,30px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,18px);box-shadow:0 40px 80px rgba(0,0,0,.35);
  transform:translateY(40px);opacity:0;transition:transform 1.1s var(--soft) .9s,opacity 1s .9s}
.scene.on .facade{transform:none;opacity:1}
.facade::before{content:"";position:absolute;left:-4%;right:-4%;bottom:100%;height:clamp(56px,6.5vw,86px);background:#C8553D;clip-path:polygon(0 100%,50% 0,100% 100%)}
.facade::after{content:"";position:absolute;right:12%;bottom:calc(100% + clamp(30px,3.5vw,46px));width:34px;height:clamp(40px,4.5vw,60px);background:#8a2a20;z-index:-1}
.win{position:relative;aspect-ratio:5/3;border-radius:999px 999px 8px 8px;background:#2a0f1c;border:3px solid #F3A493;display:grid;place-items:end center;padding:10px;font-size:clamp(12px,1.15vw,15px);font-weight:700;line-height:1.2;text-align:center;color:rgba(255,255,255,.88);transition:background .5s var(--soft),color .3s,box-shadow .5s}
.win::before{content:"";position:absolute;left:50%;top:14%;bottom:34%;width:3px;background:#F3A493;translate:-50% 0;opacity:.55}
.win:hover{background:#3d1528}
.win[aria-pressed=true]{background:var(--maiz);color:var(--tinta);box-shadow:0 0 60px 10px rgba(244,182,63,.55)}
.win[aria-pressed=true]::before{opacity:.2}
.ans{min-height:2.6em;font-family:var(--serif);font-style:italic;font-size:clamp(19px,1.9vw,26px);line-height:1.3;max-width:46ch}
@media(max-width:600px){.facade{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* desktop: the dot label already says "Para ti", and the answer needs room above the arrows and counter */
@media(min-width:761px){.bld>.n{display:none}.bld{padding-bottom:84px}}
@media(min-width:761px) and (max-height:860px){.facade{margin-top:clamp(56px,6vw,72px)}.facade::before{height:clamp(48px,5.4vw,64px)}.facade::after{bottom:calc(100% + clamp(24px,2.8vw,34px))}.win{aspect-ratio:2/1}.bld{gap:10px}}
/* short screens (720px laptops, small phones): smaller heading and windows so the answer stays clear of the arrows */
@media(max-height:760px){.bld .h.md{font-size:clamp(34px,6.6vh,52px)}.win{aspect-ratio:9/4}}
@media(max-width:760px) and (max-height:760px){.scene .bld{align-self:start;padding-top:92px;gap:10px}.facade{margin-top:48px}.facade::before{height:42px}.facade::after{bottom:calc(100% + 18px);height:32px}.win{aspect-ratio:5/2}.ans{font-size:17px}}

.nav{position:fixed;bottom:22px;left:50%;translate:-50% 0;z-index:20;display:flex;gap:14px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;transition:color .6s}
.nav button{width:44px;height:44px;border-radius:50%;border:1.5px solid currentColor;font-size:16px;letter-spacing:0;opacity:.8;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nav button:hover{opacity:1;background:rgba(255,255,255,.18)}
.nav span{opacity:.8}

/* phones: text on top, the picture rises from the bottom and fades into the sky colour */
@media(max-width:760px),(max-aspect-ratio:4/5){
  .cam{inset:0}
  .fr{height:62svh;width:calc(62svh * 1.768);top:auto;bottom:0;left:calc((100vw - 62svh * 1.768) * var(--mx,.5));
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%);mask-image:linear-gradient(to bottom,transparent 0,#000 24%)}
  .txt,.txt.left,.txt.cover,.txt.high{justify-self:center;text-align:center;justify-items:center;align-self:start;padding:88px 22px 0;max-width:none}
  .txt.left .sub{max-width:38ch}
  .h{font-size:clamp(40px,11vw,64px)}.h.md{font-size:clamp(36px,9.6vw,56px)}
  .sub{font-size:15.5px}
  .scene[data-id=parati] .fr,.scene[data-id=final] .fr{height:100svh;width:calc(100svh * 1.768);left:calc((100vw - 100svh * 1.768) * var(--mx,.5));-webkit-mask-image:none;mask-image:none}
  .bld{padding-top:70px}
  .sp{display:none}.sp.sway{display:block;width:34vw!important}
  .scene[data-id=portada] .sp.hover{display:block;left:60%!important;top:max(44%,370px)!important;width:22vw!important}
  .scene[data-id=paso1] .sp.sway,.scene[data-id=paso3] .sp.sway,.scene[data-id=parati] .sp.sway{display:none}
}

/* reading page */
#page{position:fixed;inset:0;z-index:40;background:var(--papel);color:var(--tinta);overflow-y:auto;clip-path:inset(100% 0 0 0 round 50vw 50vw 0 0);transition:clip-path .95s var(--ease);visibility:hidden}
#page.open{clip-path:inset(0 round 0);visibility:visible}
#page .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,3vw,36px);background:rgba(251,247,240,.95);z-index:2}
#page .bar .lg{color:var(--tinta)}
#page .x{min-height:42px;border:1.5px solid var(--tinta);border-radius:999px;padding:0 18px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
#page .in{width:min(760px,100% - 40px);margin:0 auto;padding:clamp(30px,6vw,80px) 0 110px}
#page .k{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--hoja)}
#page h3{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5.4vw,76px);line-height:1;letter-spacing:-.02em;margin-top:16px}
#page .lead{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.1vw,28px);line-height:1.35;margin-top:22px;color:#3d3a35}
#page .ph{margin:38px 0 10px;aspect-ratio:16/9;border-radius:200px 200px 22px 22px;background:var(--arena) center/cover no-repeat}
#page .cap{font-family:var(--serif);font-style:italic;font-size:13px;color:#6b665e}
#page .items{display:grid;gap:12px;margin-top:32px}
#page .item{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:20px;border-radius:18px;background:#fff;border:1px solid #e9dfcc}
#page .item i{width:48px;height:48px;border-radius:50%;background:var(--brote);color:var(--hoja);display:grid;place-items:center;font-family:var(--serif);font-size:20px}
#page .item b{display:block;font-size:18px}
#page .item p{color:#5e5a54;font-size:16px;margin-top:2px}
#page details{border-bottom:1px solid #e2d8c6}
#page summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:16px}
#page summary::-webkit-details-marker{display:none}
#page summary::after{content:"+";color:var(--hoja)}
#page details[open] summary::after{content:"–"}
#page details .a{padding:0 0 20px;color:#5e5a54}
#page .legal{margin-top:50px;padding-top:24px;border-top:1px solid #e2d8c6;display:grid;gap:8px;font-size:13px;color:#6b665e}
#page .next{margin-top:50px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:54px;padding:0 10px 0 24px;border-radius:999px;background:var(--senal);color:var(--tinta);font-weight:700;font-size:16px}
.btn i{width:36px;height:36px;border-radius:50%;background:var(--tinta);color:var(--senal);display:grid;place-items:center;font-style:normal}
.tlink{font-weight:700;color:var(--hoja);text-decoration:underline;text-underline-offset:5px}

/* form */
#flow{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(2,37,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);visibility:hidden;opacity:0;transition:opacity .35s,visibility 0s .35s;padding:16px}
#flow.open{visibility:visible;opacity:1;transition:opacity .35s}
.sheet{width:min(640px,100%);max-height:92svh;overflow-y:auto;background:var(--papel);color:var(--tinta);border-radius:26px;padding:24px clamp(20px,4vw,40px) 32px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}.sheet .lg{color:var(--tinta);height:20px}
.sheet .close{width:44px;height:44px;border-radius:50%;font-size:22px}
.fprog{display:flex;gap:6px;margin:20px 0 4px}.fprog i{flex:1;height:5px;border-radius:5px;background:#e2d8c6}.fprog i.on{background:var(--senal)}
.fq{display:none;padding-top:18px}.fq.on{display:block}
.fq h4{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.2vw,40px);line-height:1.05}
.fq p{margin-top:8px;color:#5e5a54;font-size:15px}
.opts{display:grid;gap:8px;margin-top:20px}
.opt{text-align:left;min-height:56px;padding:0 18px;border-radius:14px;background:#fff;border:1.5px solid #e2d8c6;font-size:16px;font-weight:500}
.opt:hover{border-color:var(--tinta)}.opt.go{background:var(--senal);border-color:var(--senal);font-weight:700}
.inp{min-height:54px;border-radius:12px;border:1.5px solid #e2d8c6;background:#fff;padding:0 14px;font:inherit;font-size:16px;width:100%;margin-top:10px;color:var(--tinta)}

/* positions are in % of the 1600x905 illustration */
const gl=(x,y,w,cls='')=>`<i class="gl ${cls}" style="left:${x}%;top:${y}%;width:${w}%"></i>`;
/* cut-paper sprites (Higgsfield, transparent): pos = CSS, w = vw, d = depth for parallax. Decorative, so alt="". */
const SPW={colibri:606,flor:557,keys:481,leaves:578,papers:568};
const sp=(n,pos,w,d,o={})=>`<i class="sp ${o.c||''}" style="${pos};width:${w}vw;--d:${d};--r:${o.r||0}deg;--r0:${o.r0??-24}deg;--fx:${o.fx||'0px'};--fy:${o.fy||'140px'};--dl:${o.dl||.9}s;--fl:${o.fl||1}"><b><img data-src="assets/img/sprites/${n}.webp" alt="" width="${SPW[n]}" height="640" decoding="async"></b></i>`;
const STONES=[[46.3,97],[49.2,87],[49.1,81.5],[53.4,75],[51.8,69],[47.8,63.5],[46.3,60.5],[47.8,57],[51.1,54],[52.6,52],[52.7,50.3]];
const STARS=[[11.3,9.4],[5.7,21.4],[21.3,28.6],[40.5,14.7],[70.2,10.4],[80.8,27.6],[94.8,36.9]];
function scenes(c){const rd=L==='en'?'Read chapter':'Leer capítulo';const st=c.plan.steps;return [
 {id:'portada',nav:c.nav[0],img:1,vid:1,bg:'#1c46a8',fx:.5,fy:.6,mx:.62,ox:'84%',oy:'58%',
  fx_:gl(84.1,57.5,30)+gl(83.6,67.5,7),
  sp_:sp('colibri','left:29%;top:7%',8.5,70,{fx:'-40vw',fy:'-10vh',r0:10,c:'hover',dl:1.6})+sp('leaves','left:-3vw;bottom:-4vh',24,140,{fy:'30vh',r0:-8,dl:.5,c:'sway'})+sp('leaves','right:-4vw;bottom:-6vh',15,110,{fy:'30vh',r0:8,fl:-1,dl:.7,c:'sway'}),
  txt:'cover',body:`<span class="n">Estavle</span><h1 class="h">${c.prologo.title.replace(/propia/,'<em>propia</em>').replace(/of your own/,'<em>of your own</em>')}</h1><p class="sub">${c.prologo.subtitle}</p><button class="read go" data-go="1">${c.prologo.enter} →</button>`},
 {id:'problema',nav:c.nav[1],img:2,bg:'#cc5036',fx:0,mx:.78,ox:'70%',oy:'40%',
  sp_:sp('papers','left:40%;top:60%',13,90,{fx:'20vw',fy:'-20vh',r:-8,r0:40,c:'drift',dl:1.2}),
  txt:'left',body:`<span class="n"><b>i</b>${c.problema.kicker}</span><h2 class="h">${c.problema.headline}</h2><p class="sub">${L==='en'?'Three honest reasons it feels hard. None of them is you.':'Tres razones honestas por las que se siente difícil. Ninguna eres tú.'}</p><button class="read" data-page="problema">${rd}</button>`},
 {id:'guia',nav:c.nav[2],img:3,vid:1,bg:'#023121',fx:.5,fy:.75,mx:.5,ox:'50%',oy:'45%',
  fx_:`<div class="path">${STONES.map((p,k)=>`<i class="gl g" style="left:${p[0]}%;top:${p[1]}%;width:${11-k*.75}%;--k:${k}"></i>`).join('')}</div>`+gl(49.8,46,6),
  sp_:sp('leaves','left:-4vw;bottom:-5vh',22,140,{fy:'30vh',r0:-8,dl:.5,c:'sway'})+sp('leaves','right:-4vw;bottom:-5vh',22,140,{fy:'30vh',r0:8,fl:-1,dl:.6,c:'sway'})+sp('colibri','left:71%;top:15%',6,60,{fx:'30vw',fy:'-20vh',fl:-1,r0:-10,c:'hover',dl:1.8}),
  txt:'high',body:`<span class="n"><b>ii</b>${c.guia.kicker}</span><h2 class="h md">${c.guia.headline}</h2><button class="read" data-page="guia">${rd}</button>`},
 {id:'paso1',nav:c.nav[3],img:4,bg:'#f5a72b',fx:0,mx:.78,ox:'72%',oy:'50%',ink:true,
  fx_:gl(73.2,55.5,13,'g'),
  sp_:sp('flor','right:-3vw;top:-6vh',21,80,{fy:'-40vh',r0:20,dl:.6,c:'sway'}),
  txt:'left',body:`<span class="n"><b>${st[0][0]}</b>${c.plan.kicker}</span><h2 class="h md">${st[0][1]}</h2><p class="sub">${st[0][2]}</p>`},
 {id:'paso2',nav:c.nav[3],img:5,bg:'#6699ea',fx:0,mx:.74,ox:'70%',oy:'60%',ink:true,
  fx_:gl(88.5,77,12,'g'),
  sp_:sp('papers','left:39%;top:7%',12,80,{fx:'30vw',fy:'0px',r:6,r0:-30,c:'drift',dl:1.1})+sp('leaves','left:-4vw;bottom:-6vh',18,130,{fy:'30vh',dl:.5,c:'sway'}),
  txt:'left',body:`<span class="n"><b>${st[1][0]}</b>${c.plan.kicker}</span><h2 class="h md">${st[1][1]}</h2><p class="sub">${st[1][2]}</p>`},
 {id:'paso3',nav:c.nav[3],img:6,bg:'#f6887b',fx:0,mx:.68,ox:'78%',oy:'50%',ink:true,
  fx_:gl(80.4,54,16)+gl(81,22,26),
  sp_:sp('keys','left:43%;top:55%',8,100,{fy:'-60vh',r:-6,r0:30,c:'swing',dl:1.5})+sp('flor','right:-3vw;top:-6vh',17,80,{fy:'-40vh',r0:20,dl:.6,c:'sway'}),
  txt:'left',body:`<span class="n"><b>${st[2][0]}</b>${c.plan.kicker}</span><h2 class="h md">${st[2][1]}</h2><p class="sub">${st[2][2]}</p><button class="read dark" data-page="plan">${L==='en'?'Not ready yet?':'¿Todavía no?'}</button>`},
 {id:'parati',nav:c.nav[4],img:7,bg:'#022618',fx:.5,fy:1,mx:.5,ox:'50%',oy:'100%',
  fx_:STARS.map((p,k)=>`<i class="tw" style="left:${p[0]}%;top:${p[1]}%;--k:${k}"></i>`).join('')+[[8.9,90],[59.4,95.9],[79.7,94.5]].map(p=>`<i class="win-gl" style="left:${p[0]}%;top:${p[1]}%;width:9%"></i>`).join(''),
  sp_:sp('flor','left:-3vw;top:-6vh',17,80,{fy:'-40vh',r0:-20,fl:-1,dl:.6,c:'sway night'})+sp('flor','right:-3vw;top:-6vh',17,80,{fy:'-40vh',r0:20,dl:.7,c:'sway night'}),
  custom:true},
 {id:'final',nav:c.nav[5],img:8,vid:1,bg:'#02241a',fx:.5,fy:1,mx:.47,ox:'46%',oy:'77%',
  fx_:'<i class="lit"></i>'+`<i class="win-gl final-gl" style="left:45.8%;top:76.6%;width:22%"></i>`+gl(86.6,16.4,14),
  sp_:sp('leaves','left:-4vw;bottom:-5vh',20,140,{fy:'30vh',dl:.5,c:'sway night'})+sp('leaves','right:-4vw;bottom:-5vh',20,140,{fy:'30vh',fl:-1,dl:.6,c:'sway night'}),
  txt:'high',body:`<h2 class="h md">${c.final.headline}</h2><p class="sub">${c.final.body}</p><button class="read go open-flow">${c.final.button} →</button><p class="sub" style="font-size:13px;opacity:.8">${c.final.micro}</p><button class="flink" data-page="faq">${c.faq.headline} →</button>`}
]}

const PAGES=c=>({
 problema:{k:c.problema.kicker,h:c.problema.headline,lead:L==='en'?'Three honest reasons. None of them is you.':'Tres razones honestas. Ninguna eres tú.',img:'assets/img/il-2.jpg',items:c.problema.items},
 guia:{k:c.guia.kicker,h:c.guia.headline,lead:c.guia.body,img:'assets/img/il-3.jpg',items:c.guia.trust.map(t=>[t,''])},
 plan:{k:c.plan.kicker,h:c.plan.headline,lead:c.plan.pro,img:'assets/img/il-6.jpg',items:c.plan.steps.map(s=>[s[0]+' · '+s[1],s[2]])},
 faq:{k:c.faq.kicker,h:c.faq.headline,faq:c.faq.items}
});

/* split headlines into rising words */
function split(el){let i=0;const walk=n=>{[...n.childNodes].forEach(x=>{if(x.nodeType===3){const f=document.createDocumentFragment();x.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.append(' ');return}const o=document.createElement('span');o.className='w';const s=document.createElement('span');s.textContent=t;s.style.setProperty('--i',i++);o.append(s);f.append(o)});x.replaceWith(f)}else if(x.nodeType===1)walk(x)})};walk(el)}

let S=[],cur=-1,lock=false;
function build(){
  const c=COPY[L];document.documentElement.lang=L;document.title='Estavle · '+c.tagline;$('meta[name=description]').content=c.desc;
  S=scenes(c);
  $('#stage').innerHTML=S.map((s,i)=>`<section class="scene${s.vid?' has-v':''}" data-i="${i}" data-id="${s.id}" aria-label="${s.nav}" style="background:${s.bg}">
    <div class="mv"><div class="cam"><div class="fr" style="--fx:${s.fx};--fy:${s.fy??.5};--mx:${s.mx};--ox:${s.ox};--oy:${s.oy}"><img data-src="assets/img/il-${s.img}.jpg" alt="${c.alts[s.img-1]}" width="1600" height="905" decoding="async"${i?'':' fetchpriority="high"'}>${s.vid?`<video class="vd" src="assets/video/il-${s.img}.mp4" data-poster="assets/img/il-${s.img}.jpg" muted loop playsinline preload="${i?'none':'metadata'}" aria-hidden="true"></video>`:''}${s.fx_||''}</div></div></div><div class="spl">${s.sp_||''}</div>
    ${s.custom?`<div class="bld"><span class="n" style="color:var(--maiz);justify-content:center">${c.parati.kicker}</span><h2 class="h md">${c.parati.headline}</h2>
      <div class="facade" role="group">${c.parati.chips.map((x,j)=>`<button class="win" aria-pressed="false" data-j="${j}">${x[0]}</button>`).join('')}</div>
      <p class="ans" id="ans" aria-live="polite">${c.parati.hint}</p></div>`:`<div class="txt ${s.txt||''} ${s.ink?'ink':''}">${s.body}</div>`}</section>`).join('');
  $$('.scene .h').forEach(split);
  const names=[...new Set(S.map(s=>s.nav))];
  $('#dots').innerHTML=names.map(n=>`<button data-n="${n}" aria-label="${n}"><span>${n}</span></button>`).join('');
  $$('#dots button').forEach(b=>b.onclick=()=>go(S.findIndex(s=>s.nav===b.dataset.n)));
  $('#lang').textContent=L==='en'?'ES':'EN';$('#cta').textContent=c.final.button;$('#faqb').textContent=c.faq.kicker;$('#skip').textContent=L==='en'?'Skip':'Saltar';
  let lit=0;const wg=$$('[data-id=parati] .win-gl');
  $$('.win').forEach(w=>w.onclick=()=>{$$('.win').forEach(x=>x.setAttribute('aria-pressed',x===w));$('#ans').textContent=c.parati.chips[+w.dataset.j][1];wg[lit++%wg.length].classList.add('on')});
  $$('.scene video').forEach(v=>v.addEventListener('playing',()=>v.classList.add('ok'),{once:true}));
  formBuild(c);
  const keep=cur;cur=-1;lock=false;go(Math.max(0,keep),true);
}
function go(i,instant){i=Math.max(0,Math.min(S.length-1,i));if(i===cur||lock)return;lock=true;
  const sc=$$('.scene'),old=sc[cur],fwd=i>cur,s=sc[i];
  sc.forEach(x=>{if(x!==old&&x!==s)x.classList.remove('on','under','rev')});
  s.style.transition='none';s.classList.toggle('back',!fwd&&!!old);s.offsetWidth;s.style.transition='';
  if(old){old.classList.remove('on');old.classList.add('under');old.classList.toggle('rev',!fwd);setTimeout(()=>old.classList.remove('under','rev'),reduce||instant?0:1200)}
  cur=i;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));
  const ink=!!S[i].ink,col=ink?'#141316':'#fff';$('.top').style.color=col;document.documentElement.style.setProperty('--chrome',col);$('#tlogo').style.color=col;$('#navb').style.color=col;
  $$('.dots button').forEach(d=>d.classList.toggle('on',d.dataset.n===S[i].nav));
  $('#pos').textContent=`${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`;
  $('#prog').style.width=((i+1)/S.length*100)+'%';
  /* lazy-load: only the current scene and its neighbours fetch their pictures */
  sc.forEach((x,k)=>{if(k<i-1||k>i+2)return;$$('[data-src]',x).forEach(m=>{m.src=m.dataset.src;m.removeAttribute('data-src')});$$('[data-poster]',x).forEach(v=>{v.poster=v.dataset.poster;v.removeAttribute('data-poster')})});
  $$('.scene video').forEach(v=>{if(v.closest('.scene')===s&&!reduce){v.play().catch(()=>{})}else setTimeout(()=>{if(!v.closest('.scene').classList.contains('on'))v.pause()},1300)});
  setTimeout(()=>lock=false,reduce?60:1150)}

/* input */
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
let wl=0;addEventListener('wheel',e=>{if(busy())return;const n=Date.now();if(n-wl<1200||Math.abs(e.deltaY)<18)return;wl=n;go(cur+(e.deltaY>0?1:-1))},{passive:true});
let ty=null;addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
addEventListener('touchend',e=>{if(ty===null||busy())return;const d=ty-e.changedTouches[0].clientY;if(Math.abs(d)>50)go(cur+(d>0?1:-1));ty=null});
addEventListener('keydown',e=>{if(busy()){if(e.key==='Escape'){closePage();$('#flow').classList.remove('open')}return}
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});
const busy=()=>$('#page').classList.contains('open')||$('#flow').classList.contains('open')||!$('#intro').classList.contains('gone');
/* the camera follows the pointer (or the phone's tilt) */
let mx=0,my=0;addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;par()});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;mx=Math.max(-.5,Math.min(.5,e.gamma/40));my=Math.max(-.5,Math.min(.5,(e.beta-40)/60));par()});
function par(){if(reduce)return;const s=$$('.scene')[cur];if(!s)return;s.style.setProperty('--px',mx.toFixed(3));s.style.setProperty('--py',my.toFixed(3));$('.cam',s).style.transform=`translate(${(-mx*2.4).toFixed(2)}%,${(-my*2).toFixed(2)}%)`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go);const p=e.target.closest('[data-page]');if(p)openPage(p.dataset.page);if(e.target.closest('.open-flow'))openFlow()});
$('#faqb').onclick=()=>openPage('faq');

/* reading page */
function openPage(k){const c=COPY[L],p=PAGES(c)[k];
  $('#pin').innerHTML=`<div class="k">${p.k}</div><h3>${p.h}</h3>${p.lead?`<p class="lead">${p.lead}</p>`:''}${p.img?`<div class="ph" style="background-image:url(${p.img})"></div><div class="cap">${c.illus}</div>`:''}
   ${p.items?`<div class="items">${p.items.map((it,i)=>`<div class="item"><i>${['i','ii','iii'][i]||'·'}</i><div><b>${it[0]}</b>${it[1]?`<p>${it[1]}</p>`:''}</div></div>`).join('')}</div>`:''}
   ${p.faq?`<div style="margin-top:30px">${p.faq.map(q=>`<details><summary>${q[0]}</summary><div class="a">${q[1]}</div></details>`).join('')}</div>`:''}
   <div class="legal">${c.footer.map(f=>`<p>${f}</p>`).join('')}</div>
   <div class="next"><button class="tlink" id="pback">${L==='en'?'← Back to the story':'← Volver a la historia'}</button><button class="btn open-flow">${c.final.button} <i>→</i></button></div>`;
  $('#page').classList.add('open');$('#page').scrollTop=0;$('#pback').onclick=closePage;$('#pclose').textContent=L==='en'?'Back':'Volver'}
function closePage(){$('#page').classList.remove('open')}
$('#pclose').onclick=closePage;

/* form */
function formBuild(c){const f=c.form;$('#sheet').innerHTML=`<div class="hd"><svg class="lg" role="img" aria-label="Estavle"><use href="#logo"/></svg><button class="close" id="fclose" aria-label="×">×</button></div>
 <div class="fprog">${f.q.map(()=>'<i></i>').join('')}<i></i></div>
 ${f.q.map(q=>`<div class="fq"><h4>${q[0]}</h4>${q[1]?`<p>${q[1]}</p>`:''}<div class="opts">${q[2].map(o=>`<button class="opt">${o}</button>`).join('')}</div></div>`).join('')}
 <div class="fq"><h4>${f.contact[0]}</h4>${f.contact[1].map(p=>`<input class="inp" placeholder="${p}" aria-label="${p}">`).join('')}<p style="margin-top:12px">${f.contact[2]}</p><div class="opts"><button class="opt go">${f.contact[3]} →</button></div></div>
 <div class="fq"><h4>${f.done[0]}</h4><p>${f.done[1]}</p></div>`;
 const fq=$$('#sheet .fq'),pr=$$('#sheet .fprog i');let fi=0;const show=i=>{fi=i;fq.forEach((q,j)=>q.classList.toggle('on',j===i));pr.forEach((b,j)=>b.classList.toggle('on',j<=i))};
 window._fs=show;$$('#sheet .opt').forEach(o=>o.onclick=()=>show(Math.min(fq.length-1,fi+1)));$('#fclose').onclick=()=>$('#flow').classList.remove('open')}
function openFlow(){$('#flow').classList.add('open');window._fs(0)}
$('#flow').addEventListener('click',e=>{if(e.target.id==='flow')$('#flow').classList.remove('open')});
$('#lang').onclick=()=>{L=L==='en'?'es':'en';try{localStorage.setItem('estavle-lang',L)}catch(e){}build()};

/* intro: the prologue, typed over a blurred cover */
build();
const T=$('#typed');let done=false;
function finish(){if(done)return;done=true;$('#intro').classList.add('gone');$('#skip').style.display='none';const s=$$('.scene')[cur];if(s){s.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')))}}
$('#skip').onclick=finish;
if(reduce||/[?&]skip/.test(location.search))finish();else (async()=>{for(const l of COPY[L].prologo.lines){if(done)return;T.textContent='';for(const ch of l){if(done)return;T.textContent+=ch;await new Promise(r=>setTimeout(r,38))}await new Promise(r=>setTimeout(r,950))}finish()})();
})();
</script>
